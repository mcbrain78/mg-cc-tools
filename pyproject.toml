[project]
name = "mg-cc-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "lxml>=6.0.2",
    "tiktoken",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "ruff", "sqlalchemy>=2.0", "types-lxml"]

[tool.pytest.ini_options]
markers = ["slow: marks tests requiring large sample files (deselect with '-m \"not slow\"')"]
addopts = "--import-mode=importlib"
pythonpath = ["."]

[dependency-groups]
dev = [
    "griffe>=2.0.2",
]
