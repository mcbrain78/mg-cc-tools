[project]
name = "mg-cc-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "lxml>=6.0.2",
    "tiktoken",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "sqlalchemy>=2.0"]

[tool.pytest.ini_options]
markers = ["slow: marks tests requiring large sample files (deselect with '-m \"not slow\"')"]

[dependency-groups]
dev = [
    "griffe>=2.0.2",
]
